</head>

  <div class="app">
    <!-- Menu latéral -->
    <aside class="menu">
      <div class="menu-titre">
        <span class="logo">🌍</span>
        <div>
          <div class="nom-site">Géopo Révision</div>
          <div class="sous-titre">ECG · HGG</div>
        </div>
      </div>
      <nav class="menu-liens">
        <a href="#/tableau" data-vue="tableau">📊 Tableau de bord</a>
        <a href="#/reviser" data-vue="reviser">🔁 Réviser</a>
        <a href="#/flashcards" data-vue="flashcards">🃏 Flashcards</a>
        <a href="#/arguments" data-vue="arguments">📚 Arguments</a>

        <a href="#/reglages" data-vue="reglages">⚙️ Réglages</a>
      </nav>
      <div class="menu-bas">

        <div class="etat-sauvegarde" id="etat-sauvegarde"></div>
        <a class="etat-auto" id="etat-auto" href="#/sauvegarde" title="Voir les réglages de sauvegarde"></a>
        <button class="btn btn-discret btn-bloc" id="btn-theme">🌙 / ☀️ Changer de thème</button>
      </div>
    </aside>

    <!-- Contenu principal -->
    <main class="contenu">
      <div id="bandeau"></div>
      <div id="vue"></div>
    </main>
  </div>

  <div id="modales"></div>
  <div id="toasts"></div>

  <script src="js/utils.js"></script>
  <script src="js/pays.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/stockage.js"></script>

  <script src="js/tableau.js"></script>

  <script src="js/sauvegarde.js"></script>
